name: CD

# Publishing a GitHub release stages that version on npm through trusted
# publishing: npm accepts this workflow's OIDC token, so no npm token is stored.
# The trusted publisher may only stage, so the version goes live once a
# maintainer approves it with 2FA, on npmjs.com or with `npm stage approve`.
# The release tag must be v<version in package.json>.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's trusted publisher names this environment, and accepts no other.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: The tag matches the version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm can stage (11.15.0 or later)
        run: |
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$(npm --version)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:mutants
      - run: pnpm test:pack
      - run: npm stage publish
